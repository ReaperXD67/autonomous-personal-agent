name: autonomous-personal-agent

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-security: &app-security
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent}
      POSTGRES_USER: ${POSTGRES_USER:-agent_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-env.ps1 first}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

  redis:
    image: redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/init-env.ps1 first}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --save 60 1 --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

  migrate:
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-agent}
      PGUSER: ${POSTGRES_USER:-agent_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-env.ps1 first}
    command:
      - sh
      - -ec
      - >-
        for migration in /migrations/*.sql; do
          echo "Applying $${migration}";
          psql --set ON_ERROR_STOP=1 --file "$${migration}";
        done
    volumes:
      - ./config/postgres/init:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    logging: *json-logging

  control-api:
    <<: *app-security
    build:
      context: .
      dockerfile: services/control-api/Dockerfile
      target: runtime
    image: autonomous-personal-agent/control-api:local
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN:?Run scripts/init-env.ps1 first}
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agent}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TASK_QUEUE_KEY: ${TASK_QUEUE_KEY:-agent:tasks:ready}
      JOB_QUEUE_KEY: ${JOB_QUEUE_KEY:-agent:jobs:ready}
      ACTION_QUEUE_KEY: ${ACTION_QUEUE_KEY:-agent:actions:ready}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-disabled}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - 127.0.0.1:${CONTROL_API_PORT:-8080}:8000
    networks:
      - edge
      - data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *json-logging

  worker:
    <<: *app-security
    build:
      context: .
      dockerfile: services/control-api/Dockerfile
      target: runtime
    image: autonomous-personal-agent/control-api:local
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN:?Run scripts/init-env.ps1 first}
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agent}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TASK_QUEUE_KEY: ${TASK_QUEUE_KEY:-agent:tasks:ready}
      JOB_QUEUE_KEY: ${JOB_QUEUE_KEY:-agent:jobs:ready}
      ACTION_QUEUE_KEY: ${ACTION_QUEUE_KEY:-agent:actions:ready}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-5}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-10}
      WORKER_RETRY_BASE_SECONDS: ${WORKER_RETRY_BASE_SECONDS:-5}
      WORKER_RETRY_MAX_SECONDS: ${WORKER_RETRY_MAX_SECONDS:-300}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - data
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    logging: *json-logging

  job-worker:
    <<: *app-security
    build:
      context: .
      dockerfile: services/control-api/Dockerfile
      target: runtime
    image: autonomous-personal-agent/control-api:local
    restart: unless-stopped
    command: ["python", "-m", "app.job_worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN:?Run scripts/init-env.ps1 first}
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agent}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TASK_QUEUE_KEY: ${TASK_QUEUE_KEY:-agent:tasks:ready}
      JOB_QUEUE_KEY: ${JOB_QUEUE_KEY:-agent:jobs:ready}
      ACTION_QUEUE_KEY: ${ACTION_QUEUE_KEY:-agent:actions:ready}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-5}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-10}
      WORKER_RETRY_BASE_SECONDS: ${WORKER_RETRY_BASE_SECONDS:-5}
      WORKER_RETRY_MAX_SECONDS: ${WORKER_RETRY_MAX_SECONDS:-300}
      CAREER_SCHEDULER_SECONDS: ${CAREER_SCHEDULER_SECONDS:-30}
      LOCAL_MODEL: ${LOCAL_MODEL:-qwen3:8b}
      OPENROUTER_ENABLED: ${OPENROUTER_ENABLED:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL_PRIORITY: ${OPENROUTER_MODEL_PRIORITY:-}
      OPENROUTER_MAX_MODELS: ${OPENROUTER_MAX_MODELS:-8}
      OPENROUTER_FREE_DAILY_ALLOWANCE: ${OPENROUTER_FREE_DAILY_ALLOWANCE:-50}
      OPENROUTER_DAILY_REQUEST_CAP: ${OPENROUTER_DAILY_REQUEST_CAP:-900}
      OPENROUTER_DATA_COLLECTION: ${OPENROUTER_DATA_COLLECTION:-deny}
      OPENROUTER_ZDR: ${OPENROUTER_ZDR:-true}
      OPENROUTER_LOCAL_FALLBACK: ${OPENROUTER_LOCAL_FALLBACK:-true}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - edge
      - data
      - model
    healthcheck:
      test: ["CMD", "python", "-m", "app.job_worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    logging: *json-logging

  action-worker:
    <<: *app-security
    profiles:
      - side-effects
      - side-effects-test
    build:
      context: .
      dockerfile: services/action-worker/Dockerfile
      target: runtime
    image: autonomous-personal-agent/action-worker:local
    restart: unless-stopped
    shm_size: 1gb
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN:?Run scripts/init-env.ps1 first}
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agent}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TASK_QUEUE_KEY: ${TASK_QUEUE_KEY:-agent:tasks:ready}
      JOB_QUEUE_KEY: ${JOB_QUEUE_KEY:-agent:jobs:ready}
      ACTION_QUEUE_KEY: ${ACTION_QUEUE_KEY:-agent:actions:ready}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-5}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-10}
      WORKER_RETRY_BASE_SECONDS: ${WORKER_RETRY_BASE_SECONDS:-5}
      WORKER_RETRY_MAX_SECONDS: ${WORKER_RETRY_MAX_SECONDS:-300}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-disabled}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - edge
      - data
    healthcheck:
      test: ["CMD", "python", "-m", "app.action_worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    logging: *json-logging

  mailpit:
    image: axllent/mailpit:v1.29.7@sha256:757f22b56c1da03570afdb3d259effe5091018008a81bbedc8158cee7e16fdbc
    profiles:
      - side-effects-test
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /data:rw,noexec,nosuid,size=64m
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "100"
      MP_ALLOW_INTERNAL_HTTP_REQUESTS: "false"
    ports:
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8025/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    logging: *json-logging

  application-fixture:
    <<: *app-security
    profiles:
      - side-effects-test
    image: autonomous-personal-agent/control-api:local
    command: ["python", "-m", "app.application_fixture"]
    networks:
      - edge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    logging: *json-logging

  dispatcher:
    <<: *app-security
    build:
      context: .
      dockerfile: services/control-api/Dockerfile
      target: runtime
    image: autonomous-personal-agent/control-api:local
    restart: unless-stopped
    command: ["python", "-m", "app.dispatcher"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN:?Run scripts/init-env.ps1 first}
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agent}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TASK_QUEUE_KEY: ${TASK_QUEUE_KEY:-agent:tasks:ready}
      JOB_QUEUE_KEY: ${JOB_QUEUE_KEY:-agent:jobs:ready}
      ACTION_QUEUE_KEY: ${ACTION_QUEUE_KEY:-agent:actions:ready}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120}
      WORKER_RETRY_BASE_SECONDS: ${WORKER_RETRY_BASE_SECONDS:-5}
      WORKER_RETRY_MAX_SECONDS: ${WORKER_RETRY_MAX_SECONDS:-300}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - data
    healthcheck:
      test: ["CMD", "python", "-m", "app.dispatcher", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    logging: *json-logging

  test:
    build:
      context: .
      dockerfile: services/control-api/Dockerfile
      target: test
    image: autonomous-personal-agent/test:local
    profiles:
      - tools
    environment:
      APP_ENV: test
      CONTROL_API_TOKEN: test-token-with-at-least-thirty-two-characters
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
    command: ["sh", "-c", "ruff check services/control-api/app services/control-api/tests tests && pytest -q"]
    network_mode: none

  omniroute:
    image: diegosouzapw/omniroute:3.8.49@sha256:92c768c56e2de32c51a0621ef182835018b00b288c9bb235c5c5e4514658c1a1
    profiles:
      - agent
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 20128
      DASHBOARD_PORT: 20128
      API_PORT: 20129
      API_HOST: 0.0.0.0
      DATA_DIR: /app/data
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD:?Run scripts/init-env.ps1 first}
      API_KEY_SECRET: ${OMNIROUTE_API_KEY_SECRET:?Run scripts/init-env.ps1 first}
      JWT_SECRET: ${OMNIROUTE_JWT_SECRET:?Run scripts/init-env.ps1 first}
      MACHINE_ID_SALT: ${OMNIROUTE_MACHINE_ID_SALT:?Run scripts/init-env.ps1 first}
      REQUIRE_API_KEY: "true"
      AUTH_COOKIE_SECURE: "false"
    volumes:
      - omniroute_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - 127.0.0.1:${OMNIROUTE_PORT:-20128}:20128
    networks:
      - edge
      - data
      - model
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

  hermes:
    image: nousresearch/hermes-agent:v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e
    profiles:
      - agent
    restart: unless-stopped
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      OPENAI_BASE_URL: http://omniroute:20128/v1
      OPENAI_API_KEY: ${OMNIROUTE_API_KEY:-CHANGE_ME_AFTER_OMNIROUTE_ONBOARDING}
    command: ["gateway", "run"]
    volumes:
      - hermes_data:/opt/data
    depends_on:
      omniroute:
        condition: service_healthy
    networks:
      - edge
      - model
    healthcheck:
      test: ["CMD", "/command/s6-svstat", "-u", "/run/service/main-hermes"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

  ollama:
    image: ollama/ollama:0.32.5@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131
    profiles:
      - local-model
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: ${LOCAL_MODEL_CONTEXT_LENGTH:-8192}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - edge
      - model
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *json-logging

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true
  model:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  omniroute_data:
  hermes_data:
  ollama_data:
