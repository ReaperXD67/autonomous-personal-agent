version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /services/control-api
    schedule:
      interval: weekly
    groups:
      python-production:
        dependency-type: production
      python-development:
        dependency-type: development

  - package-ecosystem: docker
    # Docker Dependabot scans Dockerfiles, not Compose service declarations.
    directory: /services/control-api
    schedule:
      interval: weekly
