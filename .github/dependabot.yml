version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /services/control-api
    schedule:
      interval: weekly
    groups:
      python-production:
        dependency-type: production
      python-development:
        dependency-type: development

  - package-ecosystem: uv
    directory: /services/action-worker
    schedule:
      interval: weekly
    groups:
      action-worker-python:
        patterns: ["*"]

  - package-ecosystem: docker
    # Docker Dependabot scans Dockerfiles, not Compose service declarations.
    directory: /services/control-api
    schedule:
      interval: weekly
    ignore:
      # Python 3.14 requires a coordinated project/runtime compatibility change.
      - dependency-name: python
        versions: [">= 3.14"]

  - package-ecosystem: docker
    directory: /services/action-worker
    schedule:
      interval: weekly
