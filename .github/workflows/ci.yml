name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      CONTROL_API_TOKEN: ci-control-token-with-at-least-32-characters
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      OMNIROUTE_INITIAL_PASSWORD: ci-omniroute-password
      OMNIROUTE_API_KEY_SECRET: ci-omniroute-api-key-secret
      OMNIROUTE_JWT_SECRET: ci-omniroute-jwt-secret
      OMNIROUTE_MACHINE_ID_SALT: ci-omniroute-machine-id-salt
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build test and runtime images
        run: docker compose build test control-api worker dispatcher action-worker

      - name: Diagnose package DNS after a failed build
        if: failure()
        run: |
          python3 - <<'PY'
          import json, socket
          for host in ("azure.archive.ubuntu.com", "security.ubuntu.com", "deb.debian.org"):
              try:
                  addresses = sorted({row[4][0] for row in socket.getaddrinfo(host, 80)})
                  print(json.dumps({"surface": "runner", "host": host, "addresses": addresses}))
              except OSError as exc:
                  print(json.dumps({"surface": "runner", "host": host, "error": type(exc).__name__}))
          PY
          docker run --rm -i --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --entrypoint python3 \
            mcr.microsoft.com/playwright/python:v1.63.0-noble@sha256:72bd171a9ffc2b4b59532aaa6210e21014d07093120dc25528870c0b840da1f0 - <<'PY'
          import json, socket
          for host in ("azure.archive.ubuntu.com", "security.ubuntu.com", "deb.debian.org"):
              try:
                  addresses = sorted({row[4][0] for row in socket.getaddrinfo(host, 80)})
                  print(json.dumps({"surface": "pinned_base", "host": host, "addresses": addresses}))
              except OSError as exc:
                  print(json.dumps({"surface": "pinned_base", "host": host, "error": type(exc).__name__}))
          PY

      - name: Run lint and tests
        run: docker compose --profile tools run --rm test

      - name: Verify task lifecycle and durable workflow recovery
        shell: pwsh
        run: |
          @("CONTROL_API_PORT=8080", "CONTROL_API_TOKEN=$env:CONTROL_API_TOKEN") | Set-Content .env
          ./scripts/verify.ps1

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Scan repository dependencies, secrets, and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
          version: v0.74.0

      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: autonomous-personal-agent/control-api:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
          version: v0.74.0
          skip-setup-trivy: true

      - name: Scan isolated action runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: autonomous-personal-agent/action-worker:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
          version: v0.74.0
          skip-setup-trivy: true
          trivyignores: .trivyignore.yaml

      - name: Generate runtime image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: autonomous-personal-agent/control-api:local
          format: spdx-json
          output-file: control-api.spdx.json
          artifact-name: control-api-sbom
          upload-artifact: true
          upload-artifact-retention: 14
          upload-release-assets: false

      - name: Generate action runtime image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: autonomous-personal-agent/action-worker:local
          format: spdx-json
          output-file: action-worker.spdx.json
          artifact-name: action-worker-sbom
          upload-artifact: true
          upload-artifact-retention: 14
          upload-release-assets: false
