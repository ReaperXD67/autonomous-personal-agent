name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      CONTROL_API_TOKEN: ci-control-token-with-at-least-32-characters
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      OMNIROUTE_INITIAL_PASSWORD: ci-omniroute-password
      OMNIROUTE_API_KEY_SECRET: ci-omniroute-api-key-secret
      OMNIROUTE_JWT_SECRET: ci-omniroute-jwt-secret
      OMNIROUTE_MACHINE_ID_SALT: ci-omniroute-machine-id-salt
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build test and runtime images
        run: docker compose build test control-api worker dispatcher action-worker

      - name: Run lint and tests
        run: docker compose --profile tools run --rm test

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Scan repository dependencies, secrets, and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
          version: v0.74.0

      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: autonomous-personal-agent/control-api:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
          version: v0.74.0
          skip-setup-trivy: true

      - name: Scan isolated action runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: autonomous-personal-agent/action-worker:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
          version: v0.74.0
          skip-setup-trivy: true
          trivyignores: .trivyignore.yaml

      - name: Generate runtime image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: autonomous-personal-agent/control-api:local
          format: spdx-json
          output-file: control-api.spdx.json
          artifact-name: control-api-sbom
          upload-artifact: true
          upload-artifact-retention: 14
          upload-release-assets: false

      - name: Generate action runtime image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: autonomous-personal-agent/action-worker:local
          format: spdx-json
          output-file: action-worker.spdx.json
          artifact-name: action-worker-sbom
          upload-artifact: true
          upload-artifact-retention: 14
          upload-release-assets: false
