# Deployment-owned template. The networkless hermes-config service copies it
# into the private Hermes volume on agent startup. Never place an actual key in
# this file; runtime resolves the named environment values.
model:
  provider: custom
  # Use OmniRoute's explicit free route. A generic `auto` route could select a
  # paid provider added later and cannot provide this project's zero-cost
  # invariant.
  default: free/default
  base_url: http://omniroute:20128/v1
  api_key: ${OMNIROUTE_API_KEY}

# Ordered continuity: OmniRoute is the primary above, OpenRouter's free-only
# router is secondary, and internal Qwen is the final provider-independent path.
fallback_providers:
  - provider: openrouter
    model: openrouter/free
    key_env: OPENROUTER_API_KEY
  - provider: custom
    model: qwen3:8b
    base_url: http://ollama:11434/v1
    key_env: HERMES_LOCAL_FALLBACK_KEY

approvals:
  mode: manual
  cron_mode: manual
  timeout: 300

security:
  redact_secrets: true
  tirith_enabled: true

memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: true

# MCP remains disabled until a reviewed profile is deliberately rendered.
mcp_servers: {}
